extends: default

ignore: |
  app/.venv/
  drill-output/

rules:
  document-start: disable
  line-length:
    max: 160
    # Series selectors in rule unit tests cannot be wrapped.
    ignore: |
      rules/tests/
  truthy:
    # GitHub Actions uses a bare "on:" key.
    check-keys: false
  comments:
    min-spaces-from-content: 1
