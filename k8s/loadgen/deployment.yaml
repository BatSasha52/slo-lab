apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  namespace: slo-lab
  labels:
    app.kubernetes.io/name: loadgen
    app.kubernetes.io/part-of: slo-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: loadgen
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loadgen
        app.kubernetes.io/part-of: slo-lab
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: loadgen
          image: python:3.13.15-slim-bookworm
          command: ["python", "/opt/loadgen/loadgen.py"]
          env:
            - name: RPS
              value: "10"
            - name: TARGET_URL
              value: http://demo-app.slo-lab.svc:8080/work
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: script
              mountPath: /opt/loadgen
      volumes:
        - name: script
          configMap:
            name: loadgen-script
