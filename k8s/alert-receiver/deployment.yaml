apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-receiver
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alert-receiver
    app.kubernetes.io/part-of: slo-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alert-receiver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alert-receiver
        app.kubernetes.io/part-of: slo-lab
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: receiver
          image: python:3.13.15-slim-bookworm
          command: ["python", "/opt/receiver/receiver.py"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: script
              mountPath: /opt/receiver
      volumes:
        - name: script
          configMap:
            name: alert-receiver-script
---
apiVersion: v1
kind: Service
metadata:
  name: alert-receiver
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alert-receiver
spec:
  selector:
    app.kubernetes.io/name: alert-receiver
  ports:
    - name: http
      port: 8080
      targetPort: http
