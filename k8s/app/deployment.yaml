apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: slo-lab
  labels:
    app.kubernetes.io/name: demo-app
    app.kubernetes.io/part-of: slo-lab
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never drop below the full replica count during a rollout.
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo-app
        app.kubernetes.io/part-of: slo-lab
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      # One replica per worker. nodeTaintsPolicy: Honor leaves the tainted
      # control-plane node out of the count; otherwise it would look like an
      # empty node and block the surge pod during a rolling update.
      # matchLabelKeys limits the count to pods of the same ReplicaSet, so
      # pods from the outgoing revision do not skew where new ones go.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          matchLabelKeys: ["pod-template-hash"]
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: demo-app
      containers:
        - name: demo-app
          # Built locally and loaded with `kind load`; there is no registry.
          image: slo-lab/demo-app:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: demo-app-admin
                  key: token
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            # Keeps serving while the endpoint removal propagates to kube-proxy,
            # so a rolling update does not produce connection errors.
            preStop:
              sleep:
                seconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
